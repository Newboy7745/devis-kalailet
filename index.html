<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A2145">
<link rel="icon" href="icon-192-v3.png">
<link rel="apple-touch-icon" href="icon-192-v3.png">
<title>Gestion commerciale KALAILET</title>
<meta name="description" content="Devis, suivi et contrats KALAILET CONSEIL">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
:root{
  --navy:#0A2145; --gold:#BE8336; --gold-hi:#D59239; --gold-lt:#FBEACD; --logo-bg:#FAF6EF;
  --bg:#F5F3F1; --surface:#FFFFFF; --surface-2:#FBF8F3; --ink:#0A2145; --ink-2:#44506A; --ink-3:#7A8296;
  --line:#E4DED5; --accent:#BE8336; --field:#FFFFFF; --btn:#0A2145; --btn-ink:#FFFFFF;
  --ok:#2E7D4F; --ok-bg:#E6F2EA; --warn:#A8690F; --warn-bg:#FCF1DD; --err:#B3392D; --err-bg:#FAE8E5; --info:#2F5AA8; --info-bg:#E8EEF9;
  --display:"Cormorant Garamond","Times New Roman",Georgia,serif; --body:"Montserrat","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#07142C; --surface:#0E1F42; --surface-2:#12264F; --ink:#F3EFE8; --ink-2:#C6CCDA; --ink-3:#8F98AE; --line:#24386099;
  --accent:#D59239; --field:#0A1935; --btn:#D59239; --btn-ink:#0A2145;
  --ok:#72D09A; --ok-bg:#12352A; --warn:#F1C06B; --warn-bg:#382C12; --err:#F2897B; --err-bg:#3C1B19; --info:#8FB1F0; --info-bg:#172B52;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#07142C; --surface:#0E1F42; --surface-2:#12264F; --ink:#F3EFE8; --ink-2:#C6CCDA; --ink-3:#8F98AE; --line:#24386099;
  --accent:#D59239; --field:#0A1935; --btn:#D59239; --btn-ink:#0A2145;
  --ok:#72D09A; --ok-bg:#12352A; --warn:#F1C06B; --warn-bg:#382C12; --err:#F2897B; --err-bg:#3C1B19; --info:#8FB1F0; --info-bg:#172B52;}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;padding:0 16px 104px}
.wrap{max-width:860px;margin:0 auto}
button{font-family:var(--body)}
.top{display:flex;align-items:center;gap:10px;padding-block:14px 8px;flex-wrap:wrap}
.logo{background:var(--logo-bg);border-radius:10px;padding:4px 8px;display:flex;align-items:center;border:1px solid var(--line)}
.logo img{height:46px;width:auto;display:block}
.save{margin-left:auto;font-size:11px;font-weight:600;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.save[data-s="db"] i{background:var(--ok)} .save[data-s="err"] i{background:var(--err)} .save[data-s="local"] i{background:var(--warn)}
.nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;margin:6px 0 14px}
.nav button{flex:1;border:0;background:transparent;color:var(--ink-2);font-weight:600;font-size:12.5px;padding:9px 4px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:999px;cursor:pointer}
.nav button[aria-current="true"]{background:var(--btn);color:var(--btn-ink)}
h2.v{font-family:var(--display);font-size:28px;font-weight:700;margin:6px 0 10px;line-height:1.1}
.btn{font-weight:600;font-size:13px;border-radius:999px;padding:10px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.sm{padding:7px 12px;font-size:12px}
.btn.danger{color:var(--err)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.kpi b{font-size:19px;font-variant-numeric:tabular-nums}
.kpi span{display:block;font-size:12px;color:var(--ink-3)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:12px;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold-lt);border-color:var(--gold);color:#0A2145}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:4px;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.card:hover{border-color:var(--accent)}
.card .r1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .num{font-weight:700;font-size:13px}
.card .amt{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.card .cl{font-weight:600}
.card .meta{font-size:12px;color:var(--ink-3)}
.list{display:grid;gap:8px}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.brouillon{background:var(--surface-2);color:var(--ink-2)} .pill.transmis{background:var(--info-bg);color:var(--info)}
.pill.encours{background:var(--warn-bg);color:var(--warn)} .pill.valide{background:var(--ok-bg);color:var(--ok)}
.pill.payee{background:var(--ok-bg);color:var(--ok)} .pill.attente,.pill.partielle{background:var(--info-bg);color:var(--info)} .pill.avoir,.pill.annulee{background:var(--surface-2);color:var(--ink-3)} .pill.retard{background:var(--err-bg);color:var(--err)}
.pill.refuse,.pill.abandonne,.pill.alert{background:var(--err-bg);color:var(--err)}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
details.sec>summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
summary .t{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.1}
summary .s{font-size:12px;color:var(--ink-3);margin-left:auto;text-align:right;max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
summary .chev{width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);flex:none;margin-left:4px;transition:transform .2s}
details[open]>summary .chev{transform:rotate(-135deg)}
.body{padding:2px 14px 16px;display:grid;gap:12px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
label.f{display:grid;gap:4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
label.f small{font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink-3)}
input,select,textarea{font:500 15px var(--body);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px;line-height:1.4}
input[type=number]{font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:var(--field);color:var(--ink-2);font-weight:600;font-size:13px;padding:10px 12px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-lt);color:#0A2145}
.hint{font-size:12px;color:var(--ink-3);margin:0}
.lab{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0}
.dur{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.dur button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:11px;text-align:left;cursor:pointer;color:var(--ink)}
.dur button:hover{border-color:var(--accent)}
.dur b{display:block;font-family:var(--display);font-size:20px;line-height:1.05}
.dur span{font-size:12px;color:var(--ink-3)}
.dur em{display:block;font-style:normal;font-weight:700;margin-top:5px;font-variant-numeric:tabular-nums}
.line{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;background:var(--surface-2)}
.line .lh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.line .lh b{font-size:11px;color:var(--ink-3);letter-spacing:.1em}
.line .lh .tot{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.x{border:0;background:transparent;color:var(--err);font-weight:600;font-size:12px;cursor:pointer;padding:4px 6px}
.row4{display:grid;grid-template-columns:.8fr 1.2fr 1.2fr .8fr;gap:8px}
@media (max-width:440px){.row4{grid-template-columns:1fr 1fr}}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2);cursor:pointer}
.check input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--gold)}
.conf{border-radius:10px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--line);background:var(--surface)}
.conf h3{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.conf ul{margin:0;padding:0;list-style:none;display:grid;gap:5px}
.conf li{font-size:12.5px;padding-left:14px;position:relative;color:var(--ink-2)}
.conf li::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.conf li.err::before{background:var(--err)}
.edhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.edhead .n{font-family:var(--display);font-size:26px;font-weight:700}
.edhead .sp{flex:1}
.banner{font-size:12.5px;border-radius:8px;padding:9px 12px;background:var(--info-bg);color:var(--info)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px}
.stat button{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:10px 8px;font-weight:600;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.stat button[aria-pressed="true"]{outline:2px solid var(--gold);color:var(--ink);background:var(--gold-lt);color:#0A2145}
.miles{display:grid;gap:6px}
.miles label{display:flex;gap:10px;align-items:center;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:pointer}
.miles label span{margin-left:auto;font-size:11.5px;color:var(--ink-3);text-align:right}
.miles input{width:20px;height:20px;accent-color:var(--gold);flex:none}
.log{display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.log div{position:relative;padding:0 0 10px 14px;font-size:13px}
.log div::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--gold)}
.log time{display:block;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.log em{font-style:normal;color:var(--ink-3)}
.sigbox{border:1px dashed var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;background:var(--surface-2)}
.sigbox .imgs{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sigbox img{max-height:70px;max-width:45%;background:#fff;border-radius:6px;border:1px solid var(--line);padding:4px}
.done{font-size:13px;color:var(--ok);font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;z-index:5}
.bar .sum{display:grid;line-height:1.15;margin-right:auto}
.bar .sum small{font-size:10px;letter-spacing:.14em;color:var(--ink-3);font-weight:700}
.bar .sum b{font-size:18px;font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;background:#0A214599;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding-top:calc(env(safe-area-inset-top,0px) + 20px)}
.sheet{background:var(--bg);width:100%;max-width:860px;max-height:100%;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-family:var(--display);font-size:24px;margin:0;line-height:1.1}
.mh{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.mh .sp{flex:1}
.pages{display:grid;gap:12px}
.pages canvas{width:100%;height:auto;background:#fff;border-radius:3px;box-shadow:0 1px 2px #0a214522,0 10px 28px -12px #0a214555}
.pad{width:100%;height:190px;background:#fff;border:1px solid var(--line);border-radius:10px;touch-action:none;display:block}
.recap{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;display:grid;gap:2px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:40;max-width:92vw;text-align:center;box-shadow:0 8px 24px -8px #0008}
.items{display:grid;gap:6px}
.item{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;background:var(--surface-2)}
.item span{flex:1;min-width:0}
.item small{color:var(--ink-3)}
.addrow{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center}
@media (max-width:440px){.addrow{grid-template-columns:1fr 1fr}.addrow input{grid-column:1/-1}}
.tarifs{display:grid;grid-template-columns:auto repeat(4,1fr);gap:6px;align-items:center;font-size:12px}
.tarifs b{font-size:11px;letter-spacing:.06em;color:var(--ink-2)}
.tarifs input{padding:8px;font-size:14px}
.empty{padding:26px 16px;text-align:center;color:var(--ink-3);border:1px dashed var(--line);border-radius:10px}
.stampprev{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;max-width:240px}
.diag{font-size:12px;color:var(--ink-3);display:grid;gap:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo"><img id="brandLogo" alt="KALAILET CONSEIL - Accompagnement et Formation"></div>
    <div class="save" id="save" data-s="local"><i></i><span>Enregistré sur cet appareil</span></div>
  </header>
  <nav class="nav" aria-label="Sections">
    <button type="button" id="nList" aria-current="true">Mes devis</button>
    <button type="button" id="nEdit" aria-current="false" hidden>Devis ouvert</button>
    <button type="button" id="nCtr" aria-current="false">Contrats</button>
    <button type="button" id="nFac" aria-current="false">Factures</button>
    <button type="button" id="nSet" aria-current="false">Réglages</button>
  </nav>
  <main>
    <section id="vList"></section>
    <section id="vEdit" hidden></section>
    <section id="vCtr" hidden></section>
    <section id="vFac" hidden></section>
    <section id="vSet" hidden></section>
  </main>
</div>

<div class="bar" id="bar" hidden>
  <div class="sum"><small id="barLbl">NET À PAYER</small><b id="barTot">0,00 €</b></div>
  <button class="btn" type="button" id="bPrev">Aperçu</button>
  <button class="btn pri" type="button" id="bPdf">PDF du devis</button>
  <button class="btn sm" type="button" id="bCancel" hidden>Annuler</button>
  <button class="btn gold" type="button" id="bSave" hidden>Enregistrer la modification</button>
</div>

<div class="modal" id="mPrev" hidden role="dialog" aria-modal="true" aria-labelledby="mPrevT">
  <div class="sheet">
    <div class="mh"><h3 id="mPrevT">Aperçu</h3><span class="sp"></span><button class="btn pri sm" type="button" id="mPrevDl">Télécharger le PDF</button><button class="btn sm" type="button" data-close>Fermer</button></div>
    <div class="pages" id="pages"></div>
  </div>
</div>

<div class="modal" id="mSign" hidden role="dialog" aria-modal="true" aria-labelledby="mSignT">
  <div class="sheet" style="display:grid;gap:12px">
    <div class="mh" style="margin:0"><h3 id="mSignT">Signature électronique</h3><span class="sp"></span><button class="btn sm" type="button" data-close>Annuler</button></div>
    <div class="recap" id="signRecap"></div>
    <div class="row">
      <label class="f">Nom et prénom du signataire<input id="sgName" autocomplete="off"></label>
      <label class="f">Qualité / fonction<input id="sgRole" autocomplete="off"></label>
    </div>
    <label class="f">E-mail du signataire <small>(optionnel)</small><input id="sgMail" type="email" autocomplete="off"></label>
    <label class="check"><input type="checkbox" id="sgOk"><span id="sgOkTxt"></span></label>
    <div><p class="lab" style="margin-bottom:6px">Signature (au doigt)</p><canvas class="pad" id="sgPad"></canvas>
      <div class="seg" style="margin-top:6px"><button type="button" id="sgClear">Effacer</button><label class="btn sm" for="sgStamp" style="flex:1">Ajouter le tampon de la structure</label></div>
      <input type="file" id="sgStamp" accept="image/*" hidden>
      <img id="sgStampPrev" alt="Tampon du client" class="stampprev" hidden style="margin-top:8px">
    </div>
    <p class="hint">La date et l'heure sont enregistrées automatiquement, avec l'empreinte numérique du document signé.</p>
    <button class="btn pri" type="button" id="sgGo">Valider la signature</button>
  </div>
</div>

<div class="modal" id="mPad" hidden role="dialog" aria-modal="true" aria-labelledby="mPadT">
  <div class="sheet" style="display:grid;gap:12px">
    <div class="mh" style="margin:0"><h3 id="mPadT">Ma signature</h3><span class="sp"></span><button class="btn sm" type="button" data-close>Annuler</button></div>
    <p class="hint">Signe au doigt dans le cadre. Elle sera réutilisée sur tes devis et contrats.</p>
    <canvas class="pad" id="myPad"></canvas>
    <div class="seg"><button type="button" id="myClear">Effacer</button><button type="button" id="mySave" class="btn pri">Enregistrer ma signature</button></div>
  </div>
</div>

<div class="modal" id="mBox" hidden role="dialog" aria-modal="true" aria-labelledby="mBoxT">
  <div class="sheet" style="display:grid;gap:12px">
    <div class="mh" style="margin:0"><h3 id="mBoxT"></h3><span class="sp"></span><button class="btn sm" type="button" data-close>Fermer</button></div>
    <div id="mBoxB" style="display:grid;gap:10px"></div>
  </div>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<script>
(function(){
"use strict";
/* =========================================================

/* ---------- retour de signature (côté prestataire) ---------- */
async function readReturn(str) {
  str = String(str || "").trim();
  const sh = str.match(/https?:\/\/is\.gd\/[A-Za-z0-9_]+/);
  if (sh && !/[?&]r=|#signed=/.test(str)) { try { str = await unshorten(sh[0]); } catch (e) { throw new Error("lien court illisible (" + e.message + "). Touche plutôt le lien reçu pour l'ouvrir"); } }
  const n = str.match(/[?&]r=([A-Za-z0-9_-]{8})\.([A-Za-z0-9_-]+)/);
  const m = n ? ["", "k", n[1], n[2]] : str.match(/#signed=([pc])\.([A-Za-z0-9_-]{8})\.([A-Za-z0-9_-]+)/);
  if (!m) throw new Error("ce texte n'est pas un lien de confirmation de signature");
  let hit = null;
  for (const D of Object.values(DV)) for (const kind of kindsOf(D)) { const L = sKind(D, kind).link; if (L && L.token.slice(0, 8) === m[2]) hit = { D, kind, L }; }
  if (!hit) throw new Error("aucun lien de signature en cours ne correspond (lien annulé, ou devis supprimé)");
  const { D, kind, L } = hit;
  if (L.usedAt) throw new Error("cette signature a déjà été enregistrée le " + frDT(L.usedAt));
  if (L.revokedAt) throw new Error("ce lien a été annulé le " + frDT(L.revokedAt) + " : la signature n'est pas valable");
  let u = unb64u(m[3]);
  try { if (m[1] === "k") u = await decK(u, L.key); else if (m[1] === "c") u = await unseal(u, L.code); } catch (e) { throw new Error("confirmation illisible (lien modifié ou incomplet)"); }
  const R = await zunpack(u);
  if (R.t !== L.token || R.id !== D.id || R.k !== kind) throw new Error("la confirmation ne correspond pas à ce lien");
  if (R.h !== L.h) throw new Error("le client a signé une autre version du document");
  if (await docHashN(DV[D.id], kind) !== L.h) throw new Error("le document a été modifié depuis l'envoi du lien : envoie un nouveau lien");
  if (String(R.s.at).slice(0, 10) > L.exp) throw new Error("signature faite après la date limite du lien (" + fr(L.exp) + ")");
  if (isSigned(sKind(D, kind).sign)) throw new Error("ce document est déjà signé");
  return { D, kind, L, R };
}
